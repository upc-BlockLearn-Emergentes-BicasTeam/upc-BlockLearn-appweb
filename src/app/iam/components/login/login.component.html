<div class="login-wrapper">

  <!-- ========================================================== -->
  <!-- Columna Izquierda: Branding (Visible en escritorio) -->
  <!-- ========================================================== -->
  <div class="branding-pane">
    <div class="branding-content">
      <!-- Puedes poner aquí el logo principal de la intranet o de la universidad -->
      <img src="../assets/logoblocklearn.png" alt="Intranet Logo" class="branding-logo">
      <h1 class="branding-title">Bienvenido</h1>
      <p class="branding-subtitle">Gestiona tu institución de forma fácil y eficiente.</p>
    </div>
  </div>

  <!-- ========================================================== -->
  <!-- Columna Derecha: Formulario de Login -->
  <!-- ========================================================== -->
  <div class="form-pane">
    <div class="form-container">
      <h2 class="form-title">Iniciar Sesión</h2>
      <p class="form-subtitle">Ingresa tus credenciales para acceder a tu panel.</p>

      <!-- Formulario -->
      <form (ngSubmit)="login()" novalidate>
        <!-- Campo de Email -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo Electrónico</mat-label>
          <mat-icon matPrefix>email</mat-icon>
          <!-- CAMBIO AQUÍ: user.email -> credentials.email -->
          <input matInput type="email" id="email" [(ngModel)]="credentials.email" name="email" required placeholder="ejemplo@correo.com">
        </mat-form-field>

        <!-- Campo de Contraseña -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <!-- CAMBIO AQUÍ: user.password -> credentials.password -->
          <input matInput type="password" id="password" [(ngModel)]="credentials.password" name="password" required>
        </mat-form-field>

        <!-- Mensaje de Error (Ahora dinámico) -->
        <!-- CAMBIO AQUÍ: Se muestra el mensaje de `errorMessage` -->
        <div class="error-message" *ngIf="errorMessage">
          <mat-icon>warning</mat-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Botón de Submit -->
        <button mat-flat-button color="primary" type="submit" class="full-width login-button">
          Ingresar
        </button>
      </form>

      <!-- Enlace a Registro -->
      <p class="register-link">
        ¿No tienes una cuenta institucional?
        <a routerLink="/register">Regístrate aquí</a>
      </p>
    </div>
  </div>

</div>

<!-- src/app/teacher/components/profile/profile-teacher.component.html -->

<!-- Título de página consistente con el resto de la app -->
<h2 class="page-title">
  MI PERFIL <mat-icon class="page-icon">account_circle</mat-icon>
</h2>

<!-- Tarjeta principal del perfil -->
<mat-card class="profile-card">

  <!-- ═══ CABECERA ═══ -->
  <mat-card-header class="profile-card-header">
    <div mat-card-avatar class="avatar" [style.background-image]="'url(' + (teacher.avatarUrl || defaultAvatar) + ')'"></div>
    <mat-card-title>{{ teacher.firstName }} {{ teacher.lastName }}</mat-card-title>
    <mat-card-subtitle *ngIf="!isEditing">{{ teacher.email }}</mat-card-subtitle>
  </mat-card-header>

  <!-- ═══ CONTENIDO ═══ -->
  <mat-card-content class="profile-card-content">

    <!-- ① Modo EDICIÓN -->
    <form *ngIf="isEditing; else viewMode" class="edit-form">

      <!-- Fila para el avatar -->
      <div class="form-row avatar-edit-row">
        <img class="avatar-preview" [src]="teacher.avatarUrl || defaultAvatar" alt="Avatar Preview">
        <label for="avatar-upload" class="avatar-upload-label">
          <mat-icon>upload</mat-icon>
          <span>Cambiar foto</span>
        </label>
        <input id="avatar-upload" class="avatar-upload-input" type="file" accept="image/*" (change)="onLogoSelected($event)">
      </div>

      <!-- Fila para Nombre y Apellido -->
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Nombres</mat-label>
          <input matInput [(ngModel)]="teacher.firstName" name="firstName">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Apellidos</mat-label>
          <input matInput [(ngModel)]="teacher.lastName" name="lastName">
        </mat-form-field>
      </div>

      <!-- Fila para Correo y Teléfono -->
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Correo Electrónico</mat-label>
          <input matInput [(ngModel)]="teacher.email" name="email">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Teléfono</mat-label>
          <input matInput [(ngModel)]="teacher.phone" name="phone">
        </mat-form-field>
      </div>
    </form>

    <!-- ② Modo LECTURA (rediseñado como una lista de información) -->
    <ng-template #viewMode>
      <div class="info-list">
        <div class="info-item">
          <mat-icon class="info-icon">badge</mat-icon>
          <span class="info-label">Nombre Completo:</span>
          <span class="info-value">{{ teacher.firstName }} {{ teacher.lastName }}</span>
        </div>
        <div class="info-item">
          <mat-icon class="info-icon">email</mat-icon>
          <span class="info-label">Email:</span>
          <span class="info-value">{{ teacher.email }}</span>
        </div>
        <div class="info-item">
          <mat-icon class="info-icon">phone</mat-icon>
          <span class="info-label">Teléfono:</span>
          <span class="info-value">{{ teacher.phone || 'No especificado' }}</span>
        </div>
      </div>
    </ng-template>

  </mat-card-content>

  <!-- ═══ ACCIONES ═══ -->
  <mat-card-actions class="profile-card-actions" align="end">
    <button *ngIf="!isEditing" mat-flat-button color="primary" (click)="onChangeData()">
      <mat-icon>edit</mat-icon>
      Editar Perfil
    </button>

    <ng-container *ngIf="isEditing">
      <button mat-stroked-button (click)="onCancel()">Cancelar</button>
      <button mat-flat-button color="primary" (click)="onSave()">
        <mat-icon>save</mat-icon>
        Guardar Cambios
      </button>
    </ng-container>
  </mat-card-actions>
</mat-card>

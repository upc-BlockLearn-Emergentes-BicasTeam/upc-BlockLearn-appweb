<div class="blockchain-container">
  <mat-card>
    <mat-card-title>Auditoría Blockchain</mat-card-title>
    <mat-card-subtitle>Historial de registros en bloques</mat-card-subtitle>
    <mat-divider></mat-divider>

    <mat-accordion>
      <mat-expansion-panel *ngFor="let entry of entries">
        <mat-expansion-panel-header>
          <mat-panel-title>
            Bloque ID: {{ entry.id }}
          </mat-panel-title>
          <mat-panel-description>
            Tipo: {{ entry.type }}
          </mat-panel-description>
        </mat-expansion-panel-header>

        <div class="entry-details">
          <p><strong>Hash:</strong> {{ entry.hash }}</p>
          <p *ngIf="entry.type === 'syllabus'">
            {{ getSyllabusDetails(entry) }}
          </p>
          <p *ngIf="entry.type === 'certification'">
            {{ getCertificationDetails(entry) }}
          </p>
          <p *ngIf="entry.type === 'noteRecord'">
            {{ getNoteRecordDetails(entry) }}
          </p>
        </div>

        <button mat-stroked-button color="primary" (click)="goToBlock(entry.id)">
          Ver en Blockchain
        </button>
      </mat-expansion-panel>
    </mat-accordion>
  </mat-card>
</div>

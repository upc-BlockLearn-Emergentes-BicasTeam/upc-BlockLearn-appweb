<div class="page-container">

  <!-- ========================================================== -->
  <!-- Encabezado de página consistente con el resto de la app -->
  <!-- ========================================================== -->
  <div class="page-header">
    <h1 class="page-title">
      <mat-icon class="page-icon">domain</mat-icon>
      Perfil de la Institución
    </h1>

    <!-- Acciones principales de la página -->
    <div class="header-actions">
      <!-- Botones que se muestran en modo de EDICIÓN -->
      <ng-container *ngIf="isEditing">
        <button mat-stroked-button (click)="onCancel()" [disabled]="isUploadingLogo">
          Cancelar
        </button>
        <button mat-flat-button color="primary" (click)="onSave()" [disabled]="isUploadingLogo">
          <mat-icon>save</mat-icon>
          Guardar Cambios
        </button>
      </ng-container>

      <!-- Botón que se muestra en modo de VISTA -->
      <ng-container *ngIf="!isEditing">
        <button mat-flat-button color="primary" (click)="onChangeData()">
          <mat-icon>edit</mat-icon>
          Editar Perfil
        </button>
      </ng-container>
    </div>
  </div>


  <!-- ========================================================== -->
  <!-- Contenedor principal del contenido del perfil -->
  <!-- ========================================================== -->
  <div class="profile-content-wrapper">
    <div class="profile-layout">

      <!-- Columna Izquierda: Logo e Información Adicional -->
      <div class="profile-sidebar">
        <div class="logo-container">
          <img
            [src]="institution.logoUrl || 'assets/images/default-logo.svg'"
            alt="Logo de la institución"
            class="profile-logo"
            [class.is-uploading]="isUploadingLogo"
          />
          <!-- NUEVO: Overlay con spinner que aparece durante la carga -->
          <div class="logo-overlay" *ngIf="isUploadingLogo">
            <mat-spinner diameter="50"></mat-spinner>
          </div>
        </div>

        <div class="upload-section" *ngIf="isEditing">
          <button mat-stroked-button (click)="fileInput.click()" [disabled]="isUploadingLogo">
            <mat-icon>upload</mat-icon>
            {{ isUploadingLogo ? 'Subiendo...' : 'Cambiar logo' }}
          </button>
          <input #fileInput type="file" hidden (change)="onLogoSelected($event)" accept="image/*" />
          <p class="upload-hint">PNG, JPG, o SVG (máx 2MB)</p>
        </div>
      </div>

      <!-- Columna Derecha: Formulario de Datos -->
      <div class="profile-form">
        <div class="form-grid">
          <mat-form-field appearance="outline">
            <mat-label>Nombre de la Institución</mat-label>
            <input matInput [(ngModel)]="institution.name" name="name" [readonly]="!isEditing" />
          </mat-form-field>


          <mat-form-field appearance="outline" class="full-span">
            <mat-label>Dirección</mat-label>
            <input matInput [(ngModel)]="institution.address" name="address" [readonly]="!isEditing" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Correo Electrónico de Contacto</mat-label>
            <input matInput type="email" [(ngModel)]="institution.email" name="email" [readonly]="!isEditing" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Teléfono de Contacto</mat-label>
            <input matInput [(ngModel)]="institution.phone" name="phone" [readonly]="!isEditing" />
          </mat-form-field>
        </div>
      </div>

    </div>
  </div>

</div>

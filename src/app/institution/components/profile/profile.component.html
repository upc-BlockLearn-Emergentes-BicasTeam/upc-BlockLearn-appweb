<mat-card class="profile-card">
  <mat-card-header>
    <div mat-card-avatar class="avatar-container">
      <ng-container *ngIf="institution.logoUrl; else placeholder">
        <img
          [src]="institution.logoUrl"
          alt="Institution Logo"
          class="avatar-img"
        />
      </ng-container>
      <ng-template #placeholder>
        <mat-icon class="avatar-placeholder">account_balance</mat-icon>
      </ng-template>
    </div>

    <mat-card-title>
      <ng-container *ngIf="!isEditing; else editName">
        {{ institution.name || 'Institution Profile' }}
      </ng-container>
      <ng-template #editName>
        <mat-form-field appearance="outline" class="field-full">
          <mat-label>Name</mat-label>
          <input matInput [(ngModel)]="institution.name" />
        </mat-form-field>
      </ng-template>
    </mat-card-title>

    <mat-card-actions class="header-actions">
      <button
        mat-icon-button
        aria-label="Change logo"
        *ngIf="isEditing"
        (click)="fileInput.click()"
      >
        <mat-icon>image</mat-icon>
      </button>
      <input
        #fileInput
        type="file"
        hidden
        (change)="onLogoSelected($event)"
      />

      <button
        mat-icon-button
        aria-label="Edit data"
        *ngIf="!isEditing"
        (click)="onChangeData()"
      >
        <mat-icon>edit</mat-icon>
      </button>
    </mat-card-actions>
  </mat-card-header>

  <mat-divider></mat-divider>

  <mat-card-content>
    <div class="info-grid">
      <div class="info-item">
        <mat-icon>phone</mat-icon>
        <ng-container *ngIf="!isEditing; else editPhone">
          <span>{{ institution.phone }}</span>
        </ng-container>
        <ng-template #editPhone>
          <mat-form-field appearance="outline" class="field-full">
            <mat-label>Telephone</mat-label>
            <input matInput type="tel" [(ngModel)]="institution.phone" />
          </mat-form-field>
        </ng-template>
      </div>

      <div class="info-item">
        <mat-icon>email</mat-icon>
        <ng-container *ngIf="!isEditing; else editEmail">
          <span>{{ institution.email }}</span>
        </ng-container>
        <ng-template #editEmail>
          <mat-form-field appearance="outline" class="field-full">
            <mat-label>Email</mat-label>
            <input matInput type="email" [(ngModel)]="institution.email" />
          </mat-form-field>
        </ng-template>
      </div>

      <div class="info-item">
        <mat-icon>lock</mat-icon>
        <span>********</span>
      </div>
    </div>
  </mat-card-content>

  <mat-card-actions align="end" *ngIf="isEditing" class="footer-actions">
    <button mat-raised-button color="primary" (click)="onSave()">
      Save
    </button>
    <button mat-button (click)="onCancel()">Cancel</button>
  </mat-card-actions>
</mat-card>

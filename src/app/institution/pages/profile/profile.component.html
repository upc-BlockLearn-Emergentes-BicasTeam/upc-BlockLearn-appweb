<div class="profile-card">
  <div class="avatar-section">

    <!-- Si institution.logoUrl existe, muestra la imagen -->
    <img
      *ngIf="institution.logoUrl; else fallbackIcon"
      [src]="institution.logoUrl"
      alt="Avatar"
      class="avatar-image">

    <!-- Si no hay logoUrl, muestra este bloque -->
    <ng-template #fallbackIcon>
      <div class="avatar-fallback">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          aria-hidden="true">
          <path
            d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4
               7.2 4.5 7.2 7.2s2.1 4.8 4.8 4.8z
               M4.8 21.6v-1.2c0-2.7 5.4-4.2 7.2-4.2
               s7.2 1.5 7.2 4.2v1.2H4.8z"/>
        </svg>
      </div>
    </ng-template>

    <button class="btn-change" (click)="onChangeData()">
      Change Data
    </button>
  </div>

  <div class="info-section">
    <div class="info-grid">
      <div class="info-label">Name of Institution:</div>
      <div class="info-value">{{ institution.name }}</div>

      <div class="info-label">Telephone:</div>
      <div class="info-value">{{ institution.phone }}</div>

      <div class="info-label">Email:</div>
      <div class="info-value">{{ institution.email }}</div>

      <div class="info-label">Password:</div>
      <div class="info-value">********</div>
    </div>
  </div>
</div>

<div class="courses-page">
  <!-- 1) Tarjetas de cursos -->
  <div class="course-cards">
    <div class="course-card" *ngFor="let c of courses">
      <button class="btn-delete" (click)="deleteCourse(c)" title="Delete">
        <!-- icono papelera -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M3 6h18v2H3V6zm2 3h14v13H5V9zm3 2v9h2v-9H8zm4 0v9h2v-9h-2z"/>
        </svg>
      </button>

      <div class="info-row">
        <span class="label">Name Course:</span>
        <span class="value">{{ c.name }}</span>
      </div>
      <div class="info-row">
        <span class="label">Code Course:</span>
        <span class="value">{{ c.code }}</span>
      </div>
      <div class="info-row">
        <span class="label">Section:</span>
        <span class="value">{{ c.section }}</span>
      </div>
      <div class="info-row">
        <span class="label">Teacher Name:</span>
        <span class="value">
          {{ c.teacher.firstName }} {{ c.teacher.lastName }}
        </span>
      </div>
      <div class="info-row">
        <span class="label">Teacher Email:</span>
        <span class="value">{{ c.teacher.email }}</span>
      </div>
    </div>
  </div>

  <!-- 2) Botón Add Course -->
  <button class="btn-add" (click)="openAddCourse()">
    Add Course
  </button>

  <!-- 3) Sección SYLLABUS -->
  <div class="syllabus-section">
    <h3>SYLLABUS:</h3>
    <ul class="syllabus-list">
      <li *ngFor="let e of syllabusEntries">
        <div class="syllabus-pill">
          <!-- safe-navigation por si e.course es undefined -->
          <span>Course: {{ e.course?.name }}</span>
          <span>Code Course: {{ e.course?.code }}</span>
          <span>HASH: {{ e.hash }}</span>
        </div>
        <button class="btn-block" (click)="goToBlock(e.id)">
          Go to Block-Chain
        </button>
      </li>
    </ul>
  </div>
</div>

<!-- ===== Modal: Add Course ===== -->
<div class="modal-backdrop" *ngIf="showAddModal">
  <div class="modal">
    <button class="btn-close" (click)="closeAddCourse()">×</button>
    <div class="modal-icon">
      <!-- icono curso (libro) -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M4 6v14h16V6H4zm14 12H6V8h12v10zM8 10h8v2H8zm0 4h8v2H8z"/>
      </svg>
    </div>

    <div class="form">
      <label>
        Name Course:
        <input type="text" [(ngModel)]="newCourse.name">
      </label>
      <label>
        Section:
        <input type="text" [(ngModel)]="newCourse.section">
      </label>
      <label class="syllabus-upload">
        Syllabus:
        <input
          type="text"
          readonly
          [(ngModel)]="newCourse.syllabusFileName">
        <button type="button" (click)="fileInput.click()">
          <!-- icono fichero -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0
                     0 0 2-2V8l-6-6zm1 7V3.5L18.5 9H15z"/>
          </svg>
        </button>
        <input
          #fileInput
          type="file"
          hidden
          (change)="onFileSelected($event)">
      </label>
      <label>
        Passing Grade:
        <input
          type="number"
          min="0"
          max="100"
          [(ngModel)]="newCourse.passingGrade">
      </label>
    </div>

    <div class="notes-config">
      <div><strong>%</strong></div>
      <!-- fallback a arreglo vacío y non-null assertion -->
      <div
        class="note-row"
        *ngFor="let w of (newCourse.notesWeight || []); let i = index">
        <span>Note{{ i + 1 }}:</span>
        <input
          type="number"
          min="0"
          max="100"
          [(ngModel)]="newCourse.notesWeight![i]">
      </div>
      <button class="btn-add-note" (click)="addNoteWeight()">＋</button>
    </div>

    <button class="btn-save" (click)="saveNewCourse()">
      Register Course and Syllabus
    </button>
  </div>
</div>
